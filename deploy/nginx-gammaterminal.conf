# GammaTerminal — reverse proxy + static frontend
# Put this at /etc/nginx/sites-available/gammaterminal and symlink into sites-enabled.
# HTTP only. Add TLS later with certbot (needs a domain) — see deploy/README.md.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # replace with your domain when you have one

    # ---- password gate (STRONGLY recommended before exposing publicly) ----
    # Create the file first:  sudo apt install apache2-utils
    #                         sudo htpasswd -c /etc/nginx/.htpasswd youruser
    # then uncomment these two lines:
    # auth_basic           "GammaTerminal";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # ---- built React app ----
    root /opt/gammaterminal/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- WebSocket hub ----
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    client_max_body_size 4m;
}
