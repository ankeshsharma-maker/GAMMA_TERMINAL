name: Deploy

# Redeploys the OCI server every time something lands on main (e.g. a merged pull request).
# Can also be started by hand: Actions tab -> Deploy -> Run workflow.
# One-time setup: add three repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     public IP of the VM
#   DEPLOY_USER     SSH user (usually ubuntu)
#   DEPLOY_SSH_KEY  the full private key text (contents of the .key / .pem file)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::Add DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY under Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "${DEPLOY_USER:-ubuntu}@$HOST" \
            'set -e; cd /opt/gammaterminal && git pull --ff-only origin main && bash deploy/setup.sh'
